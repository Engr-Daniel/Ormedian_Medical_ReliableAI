<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Every execution context resolves to one interpreter</title>
  <desc id="desc">A terminal and a notebook each run code through an interpreter. An import succeeds only if that interpreter's site-packages contains the package.</desc>
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F5BD8"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6170"/>
    </marker>
  </defs>
  <rect width="1200" height="540" fill="#FFFFFF"/>

  <!-- Column headings -->
  <g font-family="Quattrocento, Georgia, serif" font-size="24" font-weight="700" fill="#0B2A5B">
    <text x="40" y="44">Where I typed</text>
    <text x="440" y="44">What actually ran</text>
    <text x="860" y="44">What it can import</text>
  </g>

  <!-- Contexts -->
  <g font-family="Quattrocento, Georgia, serif" fill="#111111">
    <rect x="40" y="90" width="300" height="110" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="190" y="135" font-size="26" text-anchor="middle" font-weight="700">VS Code terminal</text>
    <text x="190" y="170" font-size="20" text-anchor="middle">(.venv) activated</text>

    <rect x="40" y="300" width="300" height="130" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="190" y="345" font-size="26" text-anchor="middle" font-weight="700">Notebook cell</text>
    <text x="190" y="380" font-size="20" text-anchor="middle">runs in a kernel,</text>
    <text x="190" y="406" font-size="20" text-anchor="middle">not in the editor</text>
  </g>

  <!-- Interpreters -->
  <g font-family="Quattrocento, Georgia, serif">
    <rect x="440" y="90" width="320" height="110" rx="14" fill="#DCEBFB" stroke="#1F5BD8" stroke-width="3"/>
    <text x="600" y="132" font-size="26" text-anchor="middle" font-weight="700" fill="#0B2A5B">Project .venv</text>
    <text x="600" y="168" font-size="20" text-anchor="middle" fill="#111111" font-family="Courier New, monospace">Python 3.11.9</text>

    <rect x="440" y="310" width="320" height="110" rx="14" fill="#F2F3F5" stroke="#5A6170" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="600" y="352" font-size="26" text-anchor="middle" font-weight="700" fill="#111111">Base Python 3.10</text>
    <text x="600" y="388" font-size="20" text-anchor="middle" fill="#111111" font-family="Courier New, monospace">Python 3.10.0</text>
  </g>

  <!-- site-packages -->
  <g font-family="Courier New, monospace" font-size="20" fill="#111111">
    <rect x="860" y="80" width="300" height="130" rx="14" fill="#FFFFFF" stroke="#1F5BD8" stroke-width="2"/>
    <text x="880" y="116">ipykernel 7.4.0</text>
    <text x="880" y="146">nest_asyncio2 ✓</text>
    <text x="880" y="176">+ 26 more</text>

    <rect x="860" y="300" width="300" height="130" rx="14" fill="#FFFFFF" stroke="#5A6170" stroke-width="2"/>
    <text x="880" y="336">ipykernel</text>
    <text x="880" y="366">nest_asyncio2 ✗</text>
    <text x="880" y="396">(different set)</text>
  </g>

  <!-- Arrows: context to interpreter -->
  <line x1="340" y1="145" x2="432" y2="145" stroke="#1F5BD8" stroke-width="4" marker-end="url(#arrow-solid)"/>
  <line x1="340" y1="340" x2="436" y2="190" stroke="#1F5BD8" stroke-width="4" marker-end="url(#arrow-solid)"/>
  <line x1="340" y1="380" x2="432" y2="370" stroke="#5A6170" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-grey)"/>

  <!-- Arrows: interpreter to packages -->
  <line x1="760" y1="145" x2="852" y2="145" stroke="#1F5BD8" stroke-width="4" marker-end="url(#arrow-solid)"/>
  <line x1="760" y1="365" x2="852" y2="365" stroke="#5A6170" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-grey)"/>

  <!-- Labels on notebook arrows -->
  <g font-family="Quattrocento, Georgia, serif" font-size="18" fill="#111111" text-anchor="middle">
    <text x="190" y="242">the selected kernel decides:</text>
    <text x="190" y="268">solid = .venv, dashed = 3.10</text>
  </g>

  <!-- Bottom message -->
  <rect x="40" y="470" width="1120" height="50" rx="10" fill="#0B2A5B"/>
  <text x="600" y="503" font-family="Quattrocento, Georgia, serif" font-size="22" text-anchor="middle" fill="#FFFFFF">Prove the interpreter with sys.executable, printed in the context that fails.</text>
</svg>
